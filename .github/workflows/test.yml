name: Protobuf relay preservation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install pinned wheel-only toolchain
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Record exact source and toolchain
        run: |
          git rev-parse HEAD
          python --version
          python -m grpc_tools.protoc --version
          python -m pip freeze
      - name: Verify checked-in code and fixture regeneration
        run: |
          python -B generate.py
          python -B make_fixtures.py
          git diff --exit-code
      - run: python -B -m unittest -v
      - run: python -B lab.py --mode preserve
      - run: git diff --exit-code
